<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giám sát an toàn phòng thí nghiệm</title>
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--panel2:#f0f2f5;--text:#1b1f27;--muted:#5d6675;--line:#dde1e8;
  --accent:#2563eb;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;
  --r1:#0072B2;--r2:#D55E00;--r3:#CC9A00;
  --shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1218;--panel:#171b23;--panel2:#1e232d;--text:#e7eaf0;--muted:#9aa3b2;--line:#2a303c;
  --accent:#6ea0ff;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;
  --r1:#56B4E9;--r2:#FF8A4C;--r3:#F0C230;--shadow:none;}}
:root[data-theme="dark"]{--bg:#0f1218;--panel:#171b23;--panel2:#1e232d;--text:#e7eaf0;--muted:#9aa3b2;--line:#2a303c;
  --accent:#6ea0ff;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--r1:#56B4E9;--r2:#FF8A4C;--r3:#F0C230;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 20px;background:var(--panel);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel2);font-size:12px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.run .dot{background:var(--ok);animation:pulse 1.4s infinite}
.pill.err .dot{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
.btn{border:1px solid var(--line);background:var(--panel);padding:5px 12px;border-radius:8px;cursor:pointer}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
select{border:1px solid var(--line);background:var(--panel);padding:5px 8px;border-radius:8px;max-width:240px}
main{padding:16px 20px;max-width:1500px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .lbl{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:26px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .sub{color:var(--muted);font-size:12px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.grid{grid-template-columns:1fr}}
.card h2{font-size:13px;margin:0 0 10px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.5px}
.live{position:relative;background:#000;border-radius:8px;overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
.live img{width:100%;height:100%;object-fit:contain;display:block}
.live .ph{position:absolute;color:#9aa3b2;font-size:13px;text-align:center;padding:12px}
.metrics{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;color:var(--muted);font-size:12.5px}
.metrics b{color:var(--text);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent);width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);padding:3px 10px;border-radius:999px;cursor:pointer;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chips input{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 8px;min-width:120px;flex:1}
.list{max-height:640px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.row{display:grid;grid-template-columns:62px 1fr auto;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.row:last-child{border-bottom:0}
.row:hover{background:var(--panel2)}
.tag{font-weight:700;font-size:12px;padding:3px 0;text-align:center;border-radius:6px;color:#fff}
.tag.R1{background:var(--r1)}.tag.R2{background:var(--r2)}.tag.R3{background:var(--r3);color:#1b1f27}
.row .t1{font-weight:600}.row .t2{color:var(--muted);font-size:12px}
.badge{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;border:1px solid var(--line)}
.badge.TP{color:var(--ok);border-color:var(--ok)}.badge.FP{color:var(--bad);border-color:var(--bad)}
.badge.sev-high{color:var(--bad)}.badge.sev-medium{color:var(--warn)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
svg text{fill:var(--muted);font-size:10.5px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:10}
.overlay.open{display:flex}
.modal{background:var(--panel);border-radius:14px;max-width:980px;width:100%;border:1px solid var(--line);padding:16px 18px}
.modal .top{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.modal .top h3{margin:0;font-size:16px}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:800px){.cols{grid-template-columns:1fr}}
.media{background:#000;border-radius:8px;overflow:hidden;margin-bottom:10px}
.media img,.media video{width:100%;display:block;max-height:52vh;object-fit:contain}
.media .na{color:#9aa3b2;padding:22px;text-align:center;font-size:13px}
dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:0;font-size:13px}
dt{color:var(--muted)}dd{margin:0;word-break:break-word}
details{margin-top:12px}summary{cursor:pointer;color:var(--muted)}
pre{background:var(--panel2);padding:10px;border-radius:8px;overflow:auto;max-height:260px;font-size:12px}
.review{display:flex;gap:8px;margin:12px 0;align-items:center;flex-wrap:wrap}
.review .btn.TP.on{background:var(--ok);border-color:var(--ok);color:#fff}
.review .btn.FP.on{background:var(--bad);border-color:var(--bad);color:#fff}
.note{font-size:12px;color:var(--muted)}
.warn{color:var(--warn)}
</style>
</head>
<body>
<header>
  <h1>Giám sát an toàn phòng thí nghiệm</h1>
  <span id="pill" class="pill"><span class="dot"></span><span id="pillText">Chưa có dữ liệu</span></span>
  <span class="sp"></span>
  <label class="note" for="runSel">Lượt chạy</label>
  <select id="runSel"></select>
  <button class="btn" id="vidBtn" style="display:none">Video đã vẽ box</button>
  <a class="btn" id="csvBtn" href="#" download>Xuất CSV</a>
  <button class="btn" id="themeBtn" title="Đổi giao diện sáng/tối">Sáng/Tối</button>
</header>

<main>
  <section class="kpis" id="kpis"></section>

  <div class="grid">
    <div style="display:grid;gap:16px">
      <section class="card">
        <h2>Camera / pipeline</h2>
        <div class="live">
          <img id="live" alt="Khung hình trực tiếp từ pipeline" hidden>
          <div class="ph" id="livePh">Chưa có khung hình. Hãy chạy <code>pipeline/runner.py</code> với thư mục <code>--out</code> nằm trong thư mục runs.</div>
        </div>
        <div class="bar"><i id="prog"></i></div>
        <div class="metrics" id="metrics"></div>
      </section>
      <section class="card">
        <h2>Số cảnh báo theo thời gian video</h2>
        <div id="timeline"></div>
        <div class="legend">
          <span><i class="sw" style="background:var(--r1)"></i> R1 Không áo blouse</span>
          <span><i class="sw" style="background:var(--r2)"></i> R2 Vùng hạn chế</span>
          <span><i class="sw" style="background:var(--r3)"></i> R3 Điện thoại</span>
        </div>
      </section>
    </div>

    <section class="card">
      <h2>Danh sách cảnh báo <span id="count" class="note"></span></h2>
      <div class="chips" id="chips"></div>
      <div class="list" id="list"></div>
    </section>
  </div>
</main>

<div class="overlay" id="ov"><div class="modal" id="modal"></div></div>

<script>
"use strict";
const RULE_LABEL = {R1:"Không mặc áo blouse", R2:"Vào vùng hạn chế", R3:"Dùng điện thoại"};
const SEV_LABEL = {high:"Cao", medium:"Trung bình", low:"Thấp"};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtT = t => { t = Number(t)||0; return String(Math.floor(t/60)).padStart(2,"0")+":"+(t%60).toFixed(1).padStart(4,"0"); };

let S = {run:null, runs:[], data:null, filter:{rules:new Set(), review:"all", q:""}, openId:null};
const params = new URLSearchParams(location.search);
if (params.get("run")) S.run = params.get("run");

function runQ(){ return S.run ? "?run="+encodeURIComponent(S.run) : ""; }
function evUrl(rel){ return rel ? "/evidence/"+encodeURIComponent(S.data.run)+"/"+rel.split("/").map(encodeURIComponent).join("/") : null; }

async function api(url, opt){ const r = await fetch(url, opt); if(!r.ok) throw new Error(r.status); return r.json(); }

async function loadRuns(){
  try{
    const d = await api("/api/runs");
    S.runs = d.runs;
    const sel = $("runSel");
    const cur = S.run || (d.default || (d.runs[0] && d.runs[0].name));
    sel.innerHTML = d.runs.map(r => `<option value="${esc(r.name)}" ${r.name===cur?"selected":""}>${esc(r.name)}${r.state==="running"?" ● đang chạy":""}</option>`).join("") || "<option>(chưa có run)</option>";
    if (!S.run && cur) S.run = cur;
  }catch(e){}
}

async function refresh(){
  try{
    S.data = await api("/api/state"+runQ());
    render();
  }catch(e){
    $("pillText").textContent = "Mất kết nối dashboard"; $("pill").className = "pill err";
  }
}

function render(){
  const d = S.data; if(!d) return;
  renderStatus(d); renderKpis(d); renderTimeline(d); renderChips(d); renderList(d);
  $("csvBtn").href = "/api/export.csv"+runQ();
  const v = (d.extra_videos||[])[0];
  $("vidBtn").style.display = v ? "" : "none";
  $("vidBtn").onclick = () => openVideo(v);
  if (S.openId) renderModal();
}

function renderStatus(d){
  const st = d.status, pill = $("pill");
  const state = st ? st.state : null;
  pill.className = "pill" + (state==="running" ? " run" : state==="error" ? " err" : "");
  $("pillText").textContent = !d.run ? "Chưa có dữ liệu" : state==="running" ? "Đang chạy" : state==="finished" ? "Đã xử lý xong" : state==="error" ? "Lỗi pipeline" : "Chỉ có log sự kiện";
  const img = $("live");
  if (d.has_live){
    img.hidden = false; $("livePh").style.display = "none";
    if (!img.dataset.busy){ img.dataset.busy = "1";
      const n = new Image(); n.onload = n.onerror = () => { delete img.dataset.busy; };
      n.onload = () => { img.src = n.src; delete img.dataset.busy; };
      n.src = "/live.jpg"+runQ()+(S.run?"&":"?")+"ts="+Date.now(); }
  } else { img.hidden = true; $("livePh").style.display = ""; }
  const m = $("metrics");
  if (!st){ m.innerHTML = "<span>Không có status.json (log từ test_tracker.py?)</span>"; $("prog").style.width="0"; return; }
  const lat = st.latency && st.latency.total ? st.latency.total : null;
  const det = st.latency && st.latency.detect ? st.latency.detect : null;
  m.innerHTML = [
    `Nguồn <b>${esc(st.source)}</b>`,
    `Khung hình <b>${st.frame_id}</b>${st.total_frames?" / "+st.total_frames:""}`,
    `Thời gian video <b>${fmtT(st.video_time_sec)}</b>`,
    `FPS <b>${st.fps}</b> (TB ${st.fps_avg})`,
    lat ? `Độ trễ/khung p50 <b>${lat.p50_ms} ms</b>, p95 <b>${lat.p95_ms} ms</b>` : "",
    det ? `Detect p50 <b>${det.p50_ms} ms</b>` : "",
    st.evidence ? `Clip: <b>${st.evidence.clips_ready}</b> xong, ${st.evidence.clips_dropped} bỏ, ${st.evidence.clips_failed} lỗi` : "",
    st.error ? `<span class="warn">${esc(st.error)}</span>` : ""
  ].filter(Boolean).map(x=>`<span>${x}</span>`).join("");
  $("prog").style.width = st.progress!=null ? (Math.min(1,st.progress)*100).toFixed(1)+"%" : (state==="running"?"100%":"0");
}

function kpi(label, val, sub, color){
  return `<div class="card kpi"><div class="lbl">${color?`<i class="sw" style="background:${color}"></i>`:""}${esc(label)}</div><div class="val">${esc(val)}</div><div class="sub">${esc(sub||"")}</div></div>`;
}
function renderKpis(d){
  const s = d.stats; if(!s){ $("kpis").innerHTML=""; return; }
  const r = s.review;
  $("kpis").innerHTML =
    kpi("Tổng cảnh báo", s.total, `${s.distinct_tracks} ID khác nhau`) +
    kpi("R1 · Không áo blouse", s.by_rule.R1||0, "", "var(--r1)") +
    kpi("R2 · Vùng hạn chế", s.by_rule.R2||0, "", "var(--r2)") +
    kpi("R3 · Điện thoại", s.by_rule.R3||0, "", "var(--r3)") +
    kpi("Cảnh báo / giờ", s.alerts_per_hour ?? "–", s.duration_sec ? `trên ${(s.duration_sec/60).toFixed(1)} phút video` : "chưa biết thời lượng") +
    kpi("Precision (đã duyệt)", r.precision!=null ? (r.precision*100).toFixed(0)+"%" : "–", `${r.tp} đúng · ${r.fp} sai · ${r.unreviewed} chưa duyệt`);
}

function renderTimeline(d){
  const t = d.stats && d.stats.timeline, el = $("timeline");
  if(!t || !t.buckets.length){ el.innerHTML = '<div class="empty">Chưa có dữ liệu</div>'; return; }
  const W=640,H=170,pl=28,pb=22,pt=8,pr=6, n=t.buckets.length;
  const max = Math.max(1, ...t.buckets.map(b=>(b.R1||0)+(b.R2||0)+(b.R3||0)));
  const bw = (W-pl-pr)/n, ch = H-pt-pb;
  let g = "";
  const ticks = Math.min(max,4);
  for(let i=0;i<=ticks;i++){ const v=Math.round(max*i/ticks), y=pt+ch-ch*v/max;
    g += `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-4}" y="${y+3}" text-anchor="end">${v}</text>`; }
  t.buckets.forEach((b,i)=>{
    let y = pt+ch; const x = pl+i*bw+1;
    for(const r of ["R1","R2","R3"]){ const v=b[r]||0; if(!v) continue; const h=ch*v/max; y-=h;
      g += `<rect x="${x}" y="${y}" width="${Math.max(1,bw-2)}" height="${h}" rx="2" fill="var(--${r.toLowerCase()})"><title>${r}: ${v} (từ ${fmtT(b.start)})</title></rect>`; }
    if(i % Math.ceil(n/8) === 0) g += `<text x="${x}" y="${H-6}">${fmtT(b.start)}</text>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Biểu đồ cảnh báo theo thời gian">${g}</svg><div class="note">Mỗi cột = ${t.bucket_sec}s video</div>`;
}

function renderChips(d){
  const f = S.filter, by = (d.stats && d.stats.by_rule) || {};
  const chip = (key,label,pressed) => `<button class="chip" data-k="${key}" aria-pressed="${pressed}">${label}</button>`;
  $("chips").innerHTML =
    ["R1","R2","R3"].map(r => chip("rule:"+r, `${r} <b>${by[r]||0}</b>`, f.rules.has(r))).join("") +
    chip("rev:all","Tất cả",f.review==="all") + chip("rev:none","Chưa duyệt",f.review==="none") +
    chip("rev:TP","Đúng (TP)",f.review==="TP") + chip("rev:FP","Sai (FP)",f.review==="FP") +
    `<input id="q" placeholder="Tìm ID, track, vùng…" value="${esc(f.q)}" aria-label="Tìm kiếm">`;
  $("chips").querySelectorAll(".chip").forEach(b => b.onclick = () => {
    const [k,v] = b.dataset.k.split(":");
    if(k==="rule"){ f.rules.has(v) ? f.rules.delete(v) : f.rules.add(v); } else f.review = v;
    renderChips(d); renderList(d); });
  const q = $("q"); q.oninput = () => { f.q = q.value; renderList(d); };
}

function filtered(d){
  const f = S.filter, q = f.q.trim().toLowerCase();
  return d.events.filter(e => {
    if(f.rules.size && !f.rules.has(e.rule_id)) return false;
    const rv = e.review && e.review.label;
    if(f.review==="none" && rv) return false;
    if((f.review==="TP"||f.review==="FP") && rv!==f.review) return false;
    if(q && !(`${e.event_id} ${e.rule_id} ${e.rule_name} track ${e.track_id} ${e.zone_id}`.toLowerCase().includes(q))) return false;
    return true; });
}

function renderList(d){
  const list = filtered(d);
  $("count").textContent = `(${list.length}/${d.events.length})`;
  const el = $("list"), keep = el.scrollTop;
  if(!list.length){ el.innerHTML = `<div class="empty">${d.events.length?"Không có cảnh báo khớp bộ lọc":"Chưa có cảnh báo nào"}</div>`; return; }
  el.innerHTML = list.map(e => {
    const rv = e.review && e.review.label, ev = e.evidence || {};
    return `<div class="row" data-id="${esc(e.event_id)}" tabindex="0">
      <span class="tag ${esc(e.rule_id)}">${esc(e.rule_id)}</span>
      <div><div class="t1">${esc(RULE_LABEL[e.rule_id]||e.rule_name)} · ID ${esc(e.track_id)}</div>
      <div class="t2">${esc(e.event_id)} · video ${fmtT(e.video_time_sec)} · kéo dài ${esc(e.duration_sec)}s · vùng ${esc(e.zone_id)}${ev.clip_status==="PENDING"?" · đang ghi clip…":""}</div></div>
      <div style="display:flex;gap:6px;align-items:center"><span class="badge sev-${esc(e.severity)}">${esc(SEV_LABEL[e.severity]||e.severity)}</span>${rv?`<span class="badge ${rv}">${rv}</span>`:""}</div></div>`; }).join("");
  el.scrollTop = keep;
  el.querySelectorAll(".row").forEach(r => { r.onclick = () => openModal(r.dataset.id);
    r.onkeydown = ev => { if(ev.key==="Enter") openModal(r.dataset.id); }; });
}

/* ---------- modal ---------- */
function openModal(id){ S.openId = id; $("ov").classList.add("open"); renderModal(); }
function closeModal(){ S.openId = null; $("ov").classList.remove("open"); $("modal").innerHTML = ""; }
$("ov").addEventListener("click", e => { if(e.target.id==="ov") closeModal(); });
document.addEventListener("keydown", e => { if(e.key==="Escape") closeModal(); });

let lastModalKey = "";
function renderModal(){
  const e = S.data.events.find(x => x.event_id===S.openId);
  if(!e){ closeModal(); return; }
  const ev = e.evidence || {}, rv = e.review && e.review.label;
  const key = JSON.stringify([e.event_id, ev.clip_status, ev.image_path, rv]);
  if(key === lastModalKey) return;          // don't restart the video on every poll
  lastModalKey = key;
  const img = evUrl(ev.image_path), clip = ev.clip_status==="READY" || (ev.clip_path && !ev.clip_status) ? evUrl(ev.clip_path) : null;
  const clipMsg = ev.clip_status==="PENDING" ? "Đang ghi clip (chờ vài giây)…" : ev.clip_status==="DROPPED" ? "Clip bị bỏ vì hàng đợi ghi đầy" : ev.clip_status==="FAILED" ? "Ghi clip lỗi: "+esc(ev.clip_error||"") : "Không có clip minh chứng cho sự kiện này";
  const det = e.details || {};
  $("modal").innerHTML = `
    <div class="top"><span class="tag ${esc(e.rule_id)}" style="padding:4px 12px">${esc(e.rule_id)}</span>
      <h3>${esc(RULE_LABEL[e.rule_id]||e.rule_name)} — ID ${esc(e.track_id)}</h3><span class="sp"></span>
      <button class="btn" id="mClose">Đóng (Esc)</button></div>
    <div class="cols"><div>
      <div class="media">${img?`<img src="${img}" alt="Ảnh minh chứng">`:'<div class="na">Không có ảnh minh chứng</div>'}</div>
      <div class="media">${clip?`<video src="${clip}" controls preload="metadata"></video>`:`<div class="na">${clipMsg}</div>`}</div>
      ${clip && ev.browser_playable===false ? `<div class="note warn">Clip dùng codec mp4v nên trình duyệt có thể không phát được. Cài ffmpeg (có trong PATH) để tự chuyển sang H.264, hoặc mở trực tiếp file trong thư mục evidence.</div>`:""}
    </div><div>
      <dl>
        <dt>Mã sự kiện</dt><dd>${esc(e.event_id)}</dd>
        <dt>Quy tắc</dt><dd>${esc(e.rule_name)}</dd>
        <dt>Mức độ</dt><dd>${esc(SEV_LABEL[e.severity]||e.severity)}</dd>
        <dt>Thời điểm</dt><dd>${esc(e.timestamp)}</dd>
        <dt>Thời gian video</dt><dd>${fmtT(e.video_time_sec)} (bắt đầu ${fmtT(e.violation_start_sec)}, kéo dài ${esc(e.duration_sec)}s)</dd>
        <dt>Frame</dt><dd>${esc(e.frame_id)}</dd>
        <dt>Vùng</dt><dd>${esc(e.zone_id)} (${esc(e.zone_type)})</dd>
        <dt>Độ tin cậy</dt><dd>${esc(e.confidence)}</dd>
        <dt>Độ trễ pipeline</dt><dd>${det.pipeline_latency_ms!=null?esc(det.pipeline_latency_ms)+" ms":"–"}</dd>
        <dt>Nguồn</dt><dd>${esc((e.source||{}).id)}</dd>
      </dl>
      <div class="review">
        <b>Đánh giá thủ công:</b>
        <button class="btn TP ${rv==="TP"?"on":""}" data-l="TP">Đúng (TP)</button>
        <button class="btn FP ${rv==="FP"?"on":""}" data-l="FP">Cảnh báo giả (FP)</button>
        <button class="btn" data-l="">Bỏ nhãn</button>
      </div>
      <div class="note">Nhãn lưu ở reviews.json trong thư mục run, dùng cho Precision và cảnh báo giả/giờ trong evaluate.py.</div>
      <details><summary>JSON gốc</summary><pre>${esc(JSON.stringify(e,null,2))}</pre></details>
    </div></div>`;
  $("mClose").onclick = closeModal;
  $("modal").querySelectorAll(".review .btn").forEach(b => b.onclick = async () => {
    const label = b.dataset.l || null;
    try{ await api("/api/review",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({run:S.data.run,event_id:e.event_id,label})}); lastModalKey=""; refresh(); }
    catch(err){ alert("Không lưu được nhãn: "+err.message); } });
}

function openVideo(name){
  S.openId = null; lastModalKey = "";
  $("ov").classList.add("open");
  $("modal").innerHTML = `<div class="top"><h3>${esc(name)}</h3><span class="sp"></span><button class="btn" id="mClose">Đóng (Esc)</button></div>
    <div class="media"><video src="/file/${encodeURIComponent(S.data.run)}/${encodeURIComponent(name)}" controls preload="metadata"></video></div>
    <div class="note">Nếu không phát được (codec mp4v), hãy mở file trực tiếp trong thư mục run bằng trình phát video.</div>`;
  $("mClose").onclick = closeModal;
}

/* ---------- misc ---------- */
$("runSel").onchange = e => { S.run = e.target.value; S.filter.rules.clear(); S.filter.review="all"; S.filter.q="";
  history.replaceState(null,"","?run="+encodeURIComponent(S.run)); refresh(); };
$("themeBtn").onclick = () => { const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark"; };

(async function(){
  await loadRuns(); await refresh();
  setInterval(refresh, 1500);
  setInterval(loadRuns, 8000);
})();
</script>
</body>
</html>
